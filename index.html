<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Decision Matrix Weighted Scorer</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
<div class="max-w-5xl mx-auto px-4 py-8">
  <h1 class="text-3xl font-bold text-gray-800 mb-2">Decision Matrix Weighted Scorer</h1>
  <p class="text-gray-500 mb-6">選択肢と評価基準を設定して、重み付きスコアで比較・意思決定をサポートします</p>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
    <!-- オプション追加 -->
    <div class="bg-white rounded-2xl shadow p-5">
      <h2 class="text-base font-semibold text-gray-700 mb-3">選択肢を追加</h2>
      <div class="flex gap-2">
        <label for="optionInput" class="sr-only">選択肢名</label>
        <input id="optionInput" type="text" placeholder="例: 転職A社" class="flex-1 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" aria-label="選択肢名">
        <button onclick="addOption()" class="bg-indigo-500 hover:bg-indigo-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition" aria-label="選択肢追加">追加</button>
      </div>
      <div id="optionList" class="mt-3 space-y-2"></div>
    </div>

    <!-- 基準追加 -->
    <div class="bg-white rounded-2xl shadow p-5">
      <h2 class="text-base font-semibold text-gray-700 mb-3">評価基準を追加</h2>
      <div class="space-y-2">
        <div>
          <label for="criteriaInput" class="sr-only">基準名</label>
          <input id="criteriaInput" type="text" placeholder="例: 給与水準" class="w-full border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400" aria-label="評価基準名">
        </div>
        <div class="flex items-center gap-2">
          <label for="weightInput" class="text-sm text-gray-600 whitespace-nowrap">重み (1-10)</label>
          <input id="weightInput" type="number" value="5" min="1" max="10" class="w-20 border rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-purple-400" aria-label="重み">
          <button onclick="addCriteria()" class="flex-1 bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded-lg text-sm font-semibold transition" aria-label="基準追加">追加</button>
        </div>
      </div>
      <div id="criteriaList" class="mt-3 space-y-2"></div>
    </div>

    <!-- 操作 -->
    <div class="bg-white rounded-2xl shadow p-5 flex flex-col gap-3">
      <h2 class="text-base font-semibold text-gray-700">操作</h2>
      <button onclick="loadSample()" class="bg-gray-100 hover:bg-gray-200 text-gray-700 py-2 px-4 rounded-lg text-sm font-medium transition" aria-label="サンプルデータ読み込み">サンプルデータ</button>
      <button onclick="calculate()" class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-lg text-sm font-semibold transition" aria-label="スコア計算">スコア計算</button>
      <button onclick="clearAll()" class="bg-red-50 hover:bg-red-100 text-red-500 py-2 px-4 rounded-lg text-sm font-medium transition" aria-label="全データ削除">全データ削除</button>
      <div class="bg-indigo-50 rounded-xl p-3 text-xs text-gray-500">
        <p class="font-semibold text-indigo-700 mb-1">使い方</p>
        <p>1. 選択肢と基準を追加</p>
        <p>2. 表でスコア入力（0-10）</p>
        <p>3. 「スコア計算」でランク付け</p>
      </div>
    </div>
  </div>

  <!-- スコア入力マトリクス -->
  <div id="matrixSection" class="bg-white rounded-2xl shadow p-6 mb-6 overflow-x-auto">
    <h2 class="text-lg font-semibold text-gray-700 mb-4">スコア入力マトリクス</h2>
    <div id="matrixTable"></div>
  </div>

  <!-- 結果 -->
  <div id="resultsSection" class="hidden bg-white rounded-2xl shadow p-6 mb-6">
    <h2 class="text-lg font-semibold text-gray-700 mb-4">結果</h2>
    <div id="ranking" class="mb-4"></div>
    <canvas id="barChart" height="200" aria-label="スコア比較棒グラフ"></canvas>
  </div>
</div>

<script>
let options = [];
let criteria = [];
let scores = {}; // scores[optionId][criteriaId] = value
let idCounter = 0;

function save() {
  localStorage.setItem('decision_matrix', JSON.stringify({ options, criteria, scores, idCounter }));
}
function load() {
  const d = localStorage.getItem('decision_matrix');
  if (d) { try { const p = JSON.parse(d); options=p.options||[]; criteria=p.criteria||[]; scores=p.scores||{}; idCounter=p.idCounter||0; } catch(e) { options=[]; criteria=[]; scores={}; idCounter=0; } }
}

function newId() { return ++idCounter; }

function addOption() {
  const name = document.getElementById('optionInput').value.trim();
  if (!name) { alert('選択肢名を入力してください'); return; }
  options.push({ id: newId(), name });
  document.getElementById('optionInput').value = '';
  save(); renderAll();
}

function addCriteria() {
  const name = document.getElementById('criteriaInput').value.trim();
  const weight = parseInt(document.getElementById('weightInput').value) || 5;
  if (!name) { alert('基準名を入力してください'); return; }
  criteria.push({ id: newId(), name, weight: Math.max(1, Math.min(10, weight)) });
  document.getElementById('criteriaInput').value = '';
  document.getElementById('weightInput').value = 5;
  save(); renderAll();
}

function deleteOption(id) { options = options.filter(o => o.id !== id); delete scores[id]; save(); renderAll(); }
function deleteCriteria(id) { criteria = criteria.filter(c => c.id !== id); Object.values(scores).forEach(s => delete s[id]); save(); renderAll(); }

function loadSample() {
  options = [{id:1,name:'転職A社'},{id:2,name:'転職B社'},{id:3,name:'現職継続'}];
  criteria = [{id:10,name:'給与水準',weight:8},{id:11,name:'ワークライフバランス',weight:7},{id:12,name:'成長機会',weight:9},{id:13,name:'通勤時間',weight:5},{id:14,name:'職場環境',weight:6}];
  scores = {
    1:{10:8,11:6,12:9,13:5,14:7},
    2:{10:7,11:8,12:7,13:8,14:8},
    3:{10:6,11:7,12:5,13:9,14:7}
  };
  idCounter = 20;
  save(); renderAll(); calculate();
}

function clearAll() {
  if (confirm('全データを削除しますか？')) { options=[]; criteria=[]; scores={}; idCounter=0; localStorage.removeItem('decision_matrix'); renderAll(); document.getElementById('resultsSection').classList.add('hidden'); }
}

function renderOptionList() {
  const list = document.getElementById('optionList');
  list.innerHTML = '';
  options.forEach(o => {
    const div = document.createElement('div');
    div.className = 'flex justify-between items-center bg-indigo-50 rounded-lg px-3 py-1.5 text-sm';
    const span = document.createElement('span');
    span.className = 'text-indigo-700 font-medium';
    span.textContent = o.name;
    const btn = document.createElement('button');
    btn.textContent = '✕'; btn.className = 'text-indigo-300 hover:text-red-500 ml-2';
    btn.setAttribute('aria-label', o.name + ' 削除');
    btn.onclick = () => deleteOption(o.id);
    div.appendChild(span); div.appendChild(btn);
    list.appendChild(div);
  });
}

function renderCriteriaList() {
  const list = document.getElementById('criteriaList');
  list.innerHTML = '';
  criteria.forEach(c => {
    const div = document.createElement('div');
    div.className = 'flex justify-between items-center bg-purple-50 rounded-lg px-3 py-1.5 text-sm';
    const left = document.createElement('div');
    const name = document.createElement('span');
    name.className = 'text-purple-700 font-medium';
    name.textContent = c.name;
    const w = document.createElement('span');
    w.className = 'text-xs text-gray-400 ml-1';
    w.textContent = '(重み:' + c.weight + ')';
    left.appendChild(name); left.appendChild(w);
    const btn = document.createElement('button');
    btn.textContent = '✕'; btn.className = 'text-purple-300 hover:text-red-500 ml-2';
    btn.setAttribute('aria-label', c.name + ' 削除');
    btn.onclick = () => deleteCriteria(c.id);
    div.appendChild(left); div.appendChild(btn);
    list.appendChild(div);
  });
}

function renderMatrix() {
  const container = document.getElementById('matrixTable');
  if (options.length === 0 || criteria.length === 0) {
    container.innerHTML = '<p class="text-gray-400 text-sm">選択肢と評価基準を追加してください</p>';
    return;
  }
  const table = document.createElement('table');
  table.className = 'min-w-full text-sm border-collapse';
  const thead = document.createElement('thead');
  const headerRow = document.createElement('tr');
  const th0 = document.createElement('th');
  th0.className = 'py-2 px-3 bg-gray-50 text-left text-xs font-semibold text-gray-500';
  th0.textContent = '選択肢 / 基準';
  headerRow.appendChild(th0);
  criteria.forEach(c => {
    const th = document.createElement('th');
    th.className = 'py-2 px-3 bg-gray-50 text-center text-xs font-semibold text-purple-600 min-w-[100px]';
    th.textContent = c.name;
    const thBr = document.createElement('br');
    const thSpan = document.createElement('span');
    thSpan.className = 'text-gray-400 font-normal';
    thSpan.textContent = '(重み:' + c.weight + ')';
    th.appendChild(thBr);
    th.appendChild(thSpan);
    headerRow.appendChild(th);
  });
  thead.appendChild(headerRow);
  table.appendChild(thead);

  const tbody = document.createElement('tbody');
  options.forEach(o => {
    const row = document.createElement('tr');
    row.className = 'border-t hover:bg-gray-50';
    const td0 = document.createElement('td');
    td0.className = 'py-2 px-3 font-semibold text-indigo-700 whitespace-nowrap';
    td0.textContent = o.name;
    row.appendChild(td0);
    criteria.forEach(c => {
      const td = document.createElement('td');
      td.className = 'py-2 px-3 text-center';
      const input = document.createElement('input');
      input.type = 'number';
      input.min = '0'; input.max = '10';
      input.value = (scores[o.id] && scores[o.id][c.id] != null) ? scores[o.id][c.id] : '';
      input.placeholder = '0-10';
      input.className = 'w-16 text-center border rounded-lg py-1 px-2 text-sm focus:outline-none focus:ring-1 focus:ring-indigo-400';
      input.setAttribute('aria-label', o.name + ' × ' + c.name + ' スコア');
      input.oninput = () => {
        if (!scores[o.id]) scores[o.id] = {};
        scores[o.id][c.id] = parseFloat(input.value) || 0;
        save();
      };
      td.appendChild(input);
      row.appendChild(td);
    });
    tbody.appendChild(row);
  });
  table.appendChild(tbody);
  container.innerHTML = '';
  container.appendChild(table);
}

function renderAll() {
  renderOptionList();
  renderCriteriaList();
  renderMatrix();
}

function calculate() {
  if (options.length === 0 || criteria.length === 0) { alert('選択肢と基準を追加してください'); return; }
  const totalWeight = criteria.reduce((s, c) => s + c.weight, 0);
  const results = options.map(o => {
    let weightedScore = 0;
    criteria.forEach(c => {
      const s = (scores[o.id] && scores[o.id][c.id] != null) ? scores[o.id][c.id] : 0;
      weightedScore += s * c.weight;
    });
    return { name: o.name, score: weightedScore / totalWeight };
  }).sort((a, b) => b.score - a.score);

  document.getElementById('resultsSection').classList.remove('hidden');
  const ranking = document.getElementById('ranking');
  ranking.innerHTML = '';
  const medals = ['🥇','🥈','🥉'];
  results.forEach((r, i) => {
    const div = document.createElement('div');
    div.className = 'flex items-center gap-3 py-2 px-4 rounded-xl mb-2 ' + (i === 0 ? 'bg-yellow-50 border border-yellow-200' : 'bg-gray-50');
    const medal = document.createElement('span');
    medal.className = 'text-xl';
    medal.textContent = medals[i] || (i+1) + '.';
    const name = document.createElement('span');
    name.className = 'font-semibold text-gray-700 flex-1';
    name.textContent = r.name;
    const score = document.createElement('span');
    score.className = 'font-bold text-indigo-600';
    score.textContent = r.score.toFixed(2) + ' / 10';
    div.appendChild(medal); div.appendChild(name); div.appendChild(score);
    ranking.appendChild(div);
  });
  drawBarChart(results);
}

function drawBarChart(results) {
  const canvas = document.getElementById('barChart');
  canvas.width = canvas.parentElement.clientWidth - 48;
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);
  const pad = { t: 20, r: 20, b: 40, l: 20 };
  const n = results.length;
  const barW = Math.min(80, (W - pad.l - pad.r) / n - 16);
  const maxScore = 10;
  const colors = ['#6366F1','#8B5CF6','#A78BFA','#C4B5FD','#DDD6FE'];

  results.forEach((r, i) => {
    const x = pad.l + i * ((W - pad.l - pad.r) / n) + (W - pad.l - pad.r) / n / 2 - barW / 2;
    const barH = (r.score / maxScore) * (H - pad.t - pad.b);
    const y = H - pad.b - barH;
    ctx.fillStyle = colors[i % colors.length];
    ctx.beginPath();
    ctx.roundRect(x, y, barW, barH, 6);
    ctx.fill();
    ctx.fillStyle = '#374151';
    ctx.textAlign = 'center'; ctx.font = 'bold 11px sans-serif';
    ctx.fillText(r.score.toFixed(1), x + barW / 2, y - 4);
    ctx.font = '11px sans-serif'; ctx.fillStyle = '#6B7280';
    ctx.fillText(r.name.substring(0, 8), x + barW / 2, H - pad.b + 14);
  });
  // Y grid
  ctx.strokeStyle = '#F3F4F6'; ctx.lineWidth = 1;
  for (let v = 0; v <= 10; v += 2) {
    const y = H - pad.b - (v / 10) * (H - pad.t - pad.b);
    ctx.beginPath(); ctx.moveTo(pad.l, y); ctx.lineTo(W - pad.r, y); ctx.stroke();
  }
}

load(); renderAll();
</script>
</body>
</html>
